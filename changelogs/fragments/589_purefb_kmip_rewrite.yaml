bugfixes:
  - purefb_kmip - Fixed the module being entirely non-functional. ``ca_certificate``
    was sent as certificate text where the API expects a reference to a certificate
    already on the array, raising ``ValidationError``; ``certificate`` was sent as a
    field that does not exist on any REST version, so it was silently discarded; and
    reading it back raised ``AttributeError``, so updates could not complete at all.
  - purefb_kmip - Fixed ``state=test`` reporting ``changed=true`` for what is a
    read-only connectivity check.
  - purefb_kmip - Fixed the 3000 character limit being applied to ``certificate``,
    a name, rather than to the certificate text it was documented against.
minor_changes:
  - purefb_kmip - Add ``ca_certificate_group`` to reference a certificate group
    rather than a single certificate.
  - purefb_kmip - Only the settings that differ are now sent on update, so an
    unrelated change no longer resends the CA reference.
